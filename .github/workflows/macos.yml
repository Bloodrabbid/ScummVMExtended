name: macOS

# Builds a macOS (Apple Silicon) .app bundle of the gamepad/touch friendly
# Stark (The Longest Journey) fork.
#
#   * Run manually from the Actions tab (workflow_dispatch) for a build artifact.
#   * Push a tag like v1.0 to also attach the zip to the GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: Build macOS app (arm64)
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('git-{0}', github.sha) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Minimal set for the Stark engine, plus dylibbundler to make the
          # .app self-contained. Optional codecs are left out so fewer dylibs
          # need bundling.
          brew install dylibbundler freetype fribidi jpeg-turbo \
            libogg libpng libvorbis flac sdl2 sdl2_net

      - name: Build cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos-arm64
          max-size: 1G
          create-symlink: true

      - name: Configure and build
        run: |
          # No --enable-release: that forces a static link (scummvm-static)
          # against .a libs Homebrew does not ship. Build dynamically instead.
          ./configure \
            --disable-debug \
            --disable-all-engines \
            --enable-engine=stark
          make -j3

      - name: Assemble .app bundle
        run: |
          # bundle-pack copies the resources and expects a "scummvm-static"
          # binary; feed it the dynamic one. It also copies the dock tile
          # plugin, so build that first. Then bundle the dylibs so the .app
          # runs on machines without Homebrew.
          cp scummvm scummvm-static
          make scummvm.docktileplugin
          make bundle-pack
          dylibbundler --overwrite-dir --bundle-deps --create-dir \
            --fix-file ScummVM.app/Contents/MacOS/scummvm \
            --dest-dir ScummVM.app/Contents/libs \
            --install-path @executable_path/../libs/

      - name: Package
        run: |
          mkdir -p out
          ZIP="ScummVM-TLJ-Gamepad-${TAG}-macOS-arm64.zip"
          # ditto preserves the bundle's structure and resource forks
          ditto -c -k --sequesterRsrc --keepParent ScummVM.app "out/${ZIP}"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scummvm-tlj-gamepad-macos
          path: out/*.zip
          if-no-files-found: error

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
